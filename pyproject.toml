[project]
name = "a-share-quant-validation"
version = "0.1.0"
description = "Runtime contracts for an A-share short-term quantitative validation system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "PyJWT>=2.9,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<22",
  "redis>=5.2,<7.0",
  "rq>=2.1,<3.0",
  "Jinja2>=3.1,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "akshare>=1.16,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM300"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["jwt", "argon2.*", "pandas", "httpx"]
ignore_missing_imports = true
