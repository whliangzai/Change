[project]
name = "a-share-quant-validation"
version = "0.1.0"
description = "Runtime contracts for an A-share short-term quantitative validation system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "PyJWT>=2.9,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM300"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["jwt", "argon2.*"]
ignore_missing_imports = true
