{% extends "base.html" %}
{% block content %}
<section class="page universe-page" data-page="universe" data-pool-api-url="{{ pool_api_url }}" data-bars-api-url="{{ bars_api_url }}">
  <div class="page-heading"><div><h1>股票池与日线</h1><p>当前股票池用于当日研究；历史股票池按交易日保留来源批次和排除原因。</p></div><a class="api-reference" data-api-url="{{ pool_api_url }}" href="{{ pool_api_url }}">股票池接口</a></div>
  <form id="universe-filters" class="filters" autocomplete="off"><label>交易日<input type="date" id="trade-date" name="trade_date" value="{{ trade_date }}" required></label><label>状态<select id="pool-status" name="status"><option value="">全部</option><option value="ELIGIBLE">入选</option><option value="EXCLUDED">排除</option></select></label><label>每页<select id="pool-page-size" name="page_size"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option></select></label><button type="submit">查询股票池</button></form>
  <div class="subtabs" role="tablist"><button type="button" class="subtab is-active" data-view="current" role="tab" aria-selected="true">当前股票池</button><button type="button" class="subtab" data-view="history" role="tab" aria-selected="false">历史股票池</button></div><div id="pool-state" class="state" role="status" aria-live="polite">正在加载股票池…</div>
  <div class="table-wrap"><table id="pool-table"><thead><tr><th>代码</th><th>交易所</th><th>板块</th><th>状态</th><th>状态来源</th><th>来源批次</th><th>上市交易日</th><th>20日成交额中位数</th><th>排除原因</th></tr></thead><tbody></tbody></table></div><nav id="pool-pagination" class="pagination" aria-label="股票池分页"></nav>
  <section class="bars-panel"><div class="detail-heading"><h2>日线行情</h2><span>仅展示授权数据；价格为数据供应商行情，不是委托价。</span></div><form id="bars-filters" class="filters"><label>股票代码<input id="bar-symbol" name="symbol" placeholder="例如 600000.SH"></label><button type="submit">查询日线</button></form><div id="bars-state" class="state" role="status" aria-live="polite"></div><div class="table-wrap"><table id="bars-table"><thead><tr><th>代码</th><th>日期</th><th>开</th><th>高</th><th>低</th><th>收</th><th>成交量</th><th>成交额</th><th>数据批次</th></tr></thead><tbody></tbody></table></div><nav id="bars-pagination" class="pagination" aria-label="日线分页"></nav></section>
</section><script src="/static/js/universe.js" defer></script>
{% endblock %}
