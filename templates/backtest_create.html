{% extends "base.html" %}
{% block content %}
<section data-page="backtest-create" class="page-shell">
  <div class="page-heading"><div><h1>新建回测</h1><p class="muted">回测使用历史数据和模拟成交规则；模拟价不是委托价。</p></div><a class="button-link" href="/backtests">查看运行</a></div>
  <div id="backtest-create-state" class="state loading" role="status">正在加载可用的数据批次。</div>
  <div id="backtest-prerequisite" class="state unavailable" role="status">仅质量门禁通过的数据批次可用于回测；策略、成本和规则版本仍由服务端逐项验证。</div>
  <form id="backtest-form" class="panel form-grid" novalidate>
    <div id="backtest-form-error" class="state error wide" role="alert" hidden></div>
    <label for="data-batch-id">数据批次 ID<span class="muted">从下方已通过质量门禁的批次中选择。</span><input name="data_batch_id" id="data-batch-id" value="batch_available" required aria-describedby="backtest-data_batch_id-error"><span id="backtest-data_batch_id-error" class="field-error" hidden></span></label><label for="backtest-strategy">策略版本 ID<input id="backtest-strategy" name="strategy_version_id" value="strategy_published" required aria-describedby="backtest-strategy_version_id-error"><span id="backtest-strategy_version_id-error" class="field-error" hidden></span></label><label for="backtest-cost">成本版本<input id="backtest-cost" name="cost_config_id" value="cost_v1" required aria-describedby="backtest-cost_config_id-error"><span id="backtest-cost_config_id-error" class="field-error" hidden></span></label><label for="backtest-rule">规则版本<input id="backtest-rule" name="rule_config_id" value="rule_v1" required aria-describedby="backtest-rule_config_id-error"><span id="backtest-rule_config_id-error" class="field-error" hidden></span></label>
    <label for="backtest-start">开始日期<input id="backtest-start" type="date" name="start_date" required aria-describedby="backtest-dates-error"></label><label for="backtest-end">结束日期<input id="backtest-end" type="date" name="end_date" required aria-describedby="backtest-dates-error"></label><label for="backtest-train">训练截止<input id="backtest-train" type="date" name="train_end" required aria-describedby="backtest-dates-error"></label><label for="backtest-valid">验证截止<input id="backtest-valid" type="date" name="valid_end" required aria-describedby="backtest-dates-error"></label><label for="backtest-oos">样本外开始<input id="backtest-oos" type="date" name="oos_start" required aria-describedby="backtest-dates-error"><span id="backtest-dates-error" class="field-error" hidden></span></label><label for="backtest-benchmark">基准代码<input id="backtest-benchmark" name="benchmark_symbol" value="000300.SH" required maxlength="32" aria-describedby="backtest-benchmark_symbol-error"><span id="backtest-benchmark_symbol-error" class="field-error" hidden></span></label><label for="backtest-equity">初始权益<input id="backtest-equity" name="initial_equity" inputmode="decimal" value="20000.00" required aria-describedby="backtest-initial_equity-error"><span id="backtest-initial_equity-error" class="field-error" hidden></span></label><input type="hidden" name="mode" value="BACKTEST">
    <div class="wide actions"><button class="primary" type="submit" id="backtest-submit" data-submit-label="创建回测">创建回测</button><span class="muted">模拟成交和模拟价只用于研究验证，不是委托、成交或收益承诺。</span></div>
  </form>
  <section class="panel"><h2>可用数据批次</h2><div id="batch-state" class="state loading" role="status">正在加载…</div><div class="table-wrap"><table id="batch-table"><thead><tr><th>批次</th><th>日期</th><th>状态</th><th>版本</th></tr></thead><tbody></tbody></table></div></section>
  <section class="panel" id="backtest-result-panel" hidden><h2>创建结果</h2><div id="backtest-result" class="state" role="status"></div><div id="backtest-links" class="actions"></div></section>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/backtest_create.js" defer></script>{% endblock %}
