{% extends "base.html" %}
{% block content %}
<section data-page="executions" data-api-url="/api/v1/executions">
  <div class="page-heading"><div><h1>人工成交录入</h1><p class="muted">仅记录已经发生的人工成交回报；不会提交券商委托、撤单或资金划转。</p></div></div>
  <form id="execution-plan-filter" class="panel form-grid"><label>计划执行日期<input type="date" name="execution_date" value="{{ data_date }}" required></label><div class="actions"><button class="primary" type="submit">加载可录入计划</button></div></form>
  <div id="execution-plans-state" class="state" role="status">可从已确认计划中选择。仅显示可由当前会话读取的计划，最终状态由服务端校验。</div>
  <div id="execution-plan-context" class="state unavailable" role="status">请选择一条已确认计划；计划、数量与剩余数量会在提交时再次由服务端核验。</div>
  <form id="execution-form" class="panel form-grid" novalidate>
    <div id="execution-form-error" class="state error wide" role="alert" hidden></div>
    <label class="wide">计划<select name="plan_id" id="execution-plan-id" required aria-describedby="execution-plan-error"><option value="">请先加载计划</option></select><span id="execution-plan-error" class="field-error" hidden></span></label><label>成交时间<input type="datetime-local" name="executed_at" required aria-describedby="execution-executed-at-error"><span id="execution-executed-at-error" class="field-error" hidden></span></label><label>成交数量<input type="number" name="quantity" min="1" step="1" required aria-describedby="execution-quantity-error"><span id="execution-quantity-error" class="field-error" hidden></span></label><label>未成交数量<input type="number" name="unfilled_quantity" min="0" step="1" value="0" required aria-describedby="execution-unfilled-quantity-error"><span id="execution-unfilled-quantity-error" class="field-error" hidden></span></label><label>成交价格<input name="price" inputmode="decimal" placeholder="12.35" required aria-describedby="execution-price-error"><span id="execution-price-error" class="field-error" hidden></span></label><label>佣金<input name="commission" inputmode="decimal" value="0.00" required aria-describedby="execution-cost-error"><span id="execution-cost-error" class="field-error" hidden></span></label><label>印花税<input name="stamp_tax" inputmode="decimal" value="0.00" required></label><label>过户费<input name="transfer_fee" inputmode="decimal" value="0.00" required></label><label>其他费用<input name="other_fee" inputmode="decimal" value="0.00" required></label><label class="wide">人工备注<textarea name="note" required minlength="1" maxlength="2048" placeholder="成交回报来源、部分成交原因等" aria-describedby="execution-note-error"></textarea><span id="execution-note-error" class="field-error" hidden></span></label><input type="hidden" name="execution_type" value="MANUAL_ENTRY"><div class="wide actions"><button class="primary" id="execution-submit" type="submit" data-submit-label="录入人工成交">录入人工成交</button></div>
  </form>
  <div id="execution-state" class="state" role="status">填写实际成交后提交；重复提交使用同一幂等键。</div>
  <p class="compliance-local">研究用途；只允许人工录入已发生的成交，不自动下单。</p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/executions.js" defer></script>{% endblock %}
