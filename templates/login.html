{% extends "base.html" %}
{% block content %}<section style="max-width:420px;margin:8vh auto 0;background:#fff;border:1px solid #d9e0e7;border-radius:6px;padding:28px"><h1 style="margin-top:0">登录研究验证系统</h1><p style="color:#5d6b78">请使用本地研究账户登录。系统仅用于研究、回测、审计及人工记录。</p><div id="login-state" class="state" hidden role="status" aria-live="polite"></div><form id="login-form" novalidate><label style="display:block;margin:14px 0">用户名<input name="username" autocomplete="username" required style="display:block;width:100%;padding:9px;border:1px solid #b8c4ce;border-radius:4px;margin-top:5px"></label><label style="display:block;margin:14px 0">密码<input name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:9px;border:1px solid #b8c4ce;border-radius:4px;margin-top:5px"></label><button class="primary" type="submit" style="width:100%">登录</button></form></section>{% endblock %}
{% block scripts %}<script>(function(){const f=document.getElementById("login-form"),s=document.getElementById("login-state");if(!f)return;f.addEventListener("submit",async e=>{e.preventDefault();const b=f.querySelector("button"),d=Object.fromEntries(new FormData(f).entries());s.hidden=false;if(!d.username||!d.password){ResearchApp.renderState(s,"error","请输入用户名和密码。");return}b.disabled=true;ResearchApp.renderState(s,"loading","正在验证账户...");try{const p=await ResearchApp.readJson(await ResearchApp.apiFetch("/api/v1/auth/login",{method:"POST",body:d}));ResearchApp.saveTokens(p.data);ResearchApp.renderState(s,"success","登录成功，正在进入系统。",p.request_id);const n=new URLSearchParams(location.search).get("next");location.href=n&&n.startsWith("/")?n:"/dashboard"}catch(x){ResearchApp.renderState(s,"error",x.message||"登录失败。");b.disabled=false}})})();</script>{% endblock %}
