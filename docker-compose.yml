services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      RQ_QUEUE: ${RQ_QUEUE:-default}
      DATA_ROOT: /app/data
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      IFIND_ENABLED: ${IFIND_ENABLED:-false}
      IFIND_BASE_URL: ${IFIND_BASE_URL:-https://quantapi.51ifind.com}
      IFIND_REFRESH_TOKEN: ${IFIND_REFRESH_TOKEN:-}
      IFIND_DAILY_RUN_AT: ${IFIND_DAILY_RUN_AT:-18:30}
      IFIND_MAX_CODES_PER_REQUEST: ${IFIND_MAX_CODES_PER_REQUEST:-200}
      IFIND_MAX_CONCURRENCY: ${IFIND_MAX_CONCURRENCY:-2}
      TUSHARE_ENABLED: ${TUSHARE_ENABLED:-false}
      TUSHARE_FULL_ENABLED: ${TUSHARE_FULL_ENABLED:-false}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_TIMEOUT_SECONDS: ${TUSHARE_TIMEOUT_SECONDS:-20}
      TUSHARE_RATE_LIMIT_PER_MINUTE: ${TUSHARE_RATE_LIMIT_PER_MINUTE:-120}
      TUSHARE_MAX_CODES_PER_REQUEST: ${TUSHARE_MAX_CODES_PER_REQUEST:-200}
      TUSHARE_MAX_CONCURRENCY: ${TUSHARE_MAX_CONCURRENCY:-2}
      TUSHARE_PILOT_CODES: ${TUSHARE_PILOT_CODES:-000001.SZ,600000.SH,000300.SH,000001.SH}
      TUSHARE_DAILY_RUN_AT: ${TUSHARE_DAILY_RUN_AT:-18:30}
      AKSHARE_VALIDATION_ENABLED: ${AKSHARE_VALIDATION_ENABLED:-true}
      AKSHARE_PRICE_RELATIVE_TOLERANCE: ${AKSHARE_PRICE_RELATIVE_TOLERANCE:-0}
      AKSHARE_VOLUME_RELATIVE_TOLERANCE: ${AKSHARE_VOLUME_RELATIVE_TOLERANCE:-0}
      AKSHARE_AMOUNT_RELATIVE_TOLERANCE: ${AKSHARE_AMOUNT_RELATIVE_TOLERANCE:-0}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - money_data_${APP_ENV:-development}:/app/data
      - money_backups_${APP_ENV:-development}:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/readiness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      RQ_QUEUE: ${RQ_QUEUE:-default}
      DATA_ROOT: /app/data
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      IFIND_ENABLED: ${IFIND_ENABLED:-false}
      IFIND_BASE_URL: ${IFIND_BASE_URL:-https://quantapi.51ifind.com}
      IFIND_REFRESH_TOKEN: ${IFIND_REFRESH_TOKEN:-}
      IFIND_DAILY_RUN_AT: ${IFIND_DAILY_RUN_AT:-18:30}
      IFIND_MAX_CODES_PER_REQUEST: ${IFIND_MAX_CODES_PER_REQUEST:-200}
      IFIND_MAX_CONCURRENCY: ${IFIND_MAX_CONCURRENCY:-2}
      TUSHARE_ENABLED: ${TUSHARE_ENABLED:-false}
      TUSHARE_FULL_ENABLED: ${TUSHARE_FULL_ENABLED:-false}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_TIMEOUT_SECONDS: ${TUSHARE_TIMEOUT_SECONDS:-20}
      TUSHARE_RATE_LIMIT_PER_MINUTE: ${TUSHARE_RATE_LIMIT_PER_MINUTE:-120}
      TUSHARE_MAX_CODES_PER_REQUEST: ${TUSHARE_MAX_CODES_PER_REQUEST:-200}
      TUSHARE_MAX_CONCURRENCY: ${TUSHARE_MAX_CONCURRENCY:-2}
      TUSHARE_PILOT_CODES: ${TUSHARE_PILOT_CODES:-000001.SZ,600000.SH,000300.SH,000001.SH}
      TUSHARE_DAILY_RUN_AT: ${TUSHARE_DAILY_RUN_AT:-18:30}
      AKSHARE_VALIDATION_ENABLED: ${AKSHARE_VALIDATION_ENABLED:-true}
      AKSHARE_PRICE_RELATIVE_TOLERANCE: ${AKSHARE_PRICE_RELATIVE_TOLERANCE:-0}
      AKSHARE_VOLUME_RELATIVE_TOLERANCE: ${AKSHARE_VOLUME_RELATIVE_TOLERANCE:-0}
      AKSHARE_AMOUNT_RELATIVE_TOLERANCE: ${AKSHARE_AMOUNT_RELATIVE_TOLERANCE:-0}
    volumes:
      - money_data_${APP_ENV:-development}:/app/data
      - money_backups_${APP_ENV:-development}:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.jobs.queue import QueueSettings, redis_connection; redis_connection(QueueSettings.from_env())"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money}
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - money_postgres_${APP_ENV:-development}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - money_redis_${APP_ENV:-development}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  money_data_development:
  money_data_test:
  money_data_simulation:
  money_backups_development:
  money_backups_test:
  money_backups_simulation:
  money_postgres_development:
  money_postgres_test:
  money_postgres_simulation:
  money_redis_development:
  money_redis_test:
  money_redis_simulation:
